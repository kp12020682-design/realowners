<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login • Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
  body {
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);
    background-size: 300% 300%;
    animation: bgShift 12s ease infinite;
    padding: 20px;
  }
  @keyframes bgShift {
    0% { background-position:0% 50%; }
    50% { background-position:100% 50%; }
    100% { background-position:0% 50%; }
  }

  .card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 24px;
    padding: 45px 40px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    animation: slideUp 0.6s ease;
  }
  @keyframes slideUp {
    from { opacity:0; transform: translateY(30px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .logo {
    width: 70px; height: 70px;
    background: linear-gradient(135deg,#fff,#e0e7ff);
    border-radius: 20px;
    display:flex; align-items:center; justify-content:center;
    font-size: 32px;
    margin: 0 auto 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  h1 {
    color:#fff;
    text-align:center;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .sub {
    color: rgba(255,255,255,0.85);
    text-align:center;
    font-size: 14px;
    margin-bottom: 30px;
  }

  .field {
    position: relative;
    margin-bottom: 18px;
  }
  .field input {
    width: 100%;
    padding: 14px 16px 14px 46px;
    border-radius: 14px;
    border: 1.5px solid rgba(255,255,255,0.4);
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: all 0.25s;
  }
  .field input::placeholder { color: rgba(255,255,255,0.75); }
  .field input:focus {
    border-color:#fff;
    background: rgba(255,255,255,0.3);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.15);
  }
  .field .icon {
    position:absolute; left:16px; top:50%;
    transform: translateY(-50%);
    font-size:16px; opacity:0.9;
  }

  button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 14px;
    background: #fff;
    color: #764ba2;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.25s;
    margin-top: 8px;
    letter-spacing: 0.3px;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.2);
  }
  button:active { transform: translateY(0); }

  .flash {
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13.5px;
    margin-bottom: 16px;
    text-align:center;
    animation: fadeIn 0.4s;
  }
  .flash.error   { background: rgba(255,80,80,0.25); color:#fff; border:1px solid rgba(255,120,120,0.5);}
  .flash.success { background: rgba(80,255,150,0.25); color:#fff; border:1px solid rgba(120,255,180,0.5);}

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }

  .hint {
    text-align:center;
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    margin-top: 20px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🔐</div>
    <h1>Welcome Back</h1>
    <p class="sub">Apna dashboard kholne ke liye login karein</p>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}
        <div class="flash {{ cat }}">{{ m }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST">
      <div class="field">
        <span class="icon">👤</span>
        <input type="text" name="username" placeholder="Username" required autofocus>
      </div>
      <div class="field">
        <span class="icon">🔑</span>
        <input type="password" name="password" placeholder="Password" required>
      </div>
      <button type="submit">Login →</button>
    </form>

    <div class="hint">Default: admin / admin123</div>
  </div>
</body>
</html>
